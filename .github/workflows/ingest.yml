name: Ingest articles (RSS pollers)

on:
  # Every 15 minutes. GitHub Actions schedules are best-effort and can run
  # 5-15 minutes late under load — that's acceptable for Phase 2.
  schedule:
    - cron: "*/15 * * * *"

  # Manual trigger for ad-hoc runs from the Actions tab.
  workflow_dispatch: {}

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      # pnpm version is taken from "packageManager" in root package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ingestion pass
        run: pnpm --filter @ctm/worker-ingestion start
